name: Full CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Run Linux ARM64 and both macOS architectures too
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: full-ci-${{ github.head_ref || github.ref_name }}-${{ inputs.all_platforms == true && 'all' || 'linux' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  release-contract:
    name: Fork release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s scripts -p fork_release_gate_test.py
      - run: python3 -m unittest scripts.tests.test_private_ci

  build:
    if: ${{ !(vars.PRIVATE_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ripgrim' && github.event.pull_request.head.repo.full_name == 'ripgrim/fx') }}
    name: Build (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all_platforms == true && '[{"name":"linux-x86_64","runner":"ubuntu-24.04"},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"name":"macos-x86_64","runner":"macos-15-intel"},{"name":"macos-aarch64","runner":"macos-15"}]' || '[{"name":"linux-x86_64","runner":"ubuntu-24.04"}]') }}
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: full-ci-build-${{ matrix.platform.name }}-${{ matrix.optimize }}

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Smoke test fresh binary
        shell: bash
        run: |
          help_stdout="$(mktemp)"
          help_stderr="$(mktemp)"
          status_stdout="$(mktemp)"
          status_stderr="$(mktemp)"
          trap 'rm -f "$help_stdout" "$help_stderr" "$status_stdout" "$status_stderr"' EXIT

          ./zig-out/bin/fx help >"$help_stdout" 2>"$help_stderr"
          test -s "$help_stdout"
          test ! -s "$help_stderr"

          ./zig-out/bin/fx status --json >"$status_stdout" 2>"$status_stderr"
          test -s "$status_stdout"
          test ! -s "$status_stderr"

      - name: Package tested binary
        shell: bash
        run: tar -cf "$RUNNER_TEMP/fx-ci.tar" -C zig-out/bin fx

      - name: Upload tested binary
        uses: actions/upload-artifact@v4
        with:
          name: fx-ci-${{ matrix.platform.name }}-${{ matrix.optimize }}-${{ github.sha }}
          path: ${{ runner.temp }}/fx-ci.tar
          if-no-files-found: error
          retention-days: 1

  native:
    if: ${{ !(vars.PRIVATE_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ripgrim' && github.event.pull_request.head.repo.full_name == 'ripgrim/fx') }}
    name: Native checks (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all_platforms == true && '[{"name":"linux-x86_64","runner":"ubuntu-24.04"},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm"},{"name":"macos-x86_64","runner":"macos-15-intel"},{"name":"macos-aarch64","runner":"macos-15"}]' || '[{"name":"linux-x86_64","runner":"ubuntu-24.04"}]') }}
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: full-ci-native-${{ matrix.platform.name }}-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Run unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

  e2e:
    needs: build
    name: E2E (${{ matrix.optimize }}, ${{ matrix.platform.name }}, shard ${{ matrix.shard.label }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.all_platforms == true && '[{"name":"linux-x86_64","runner":"ubuntu-24.04","zig_tarball":"zig-x86_64-linux"},{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","zig_tarball":"zig-aarch64-linux"},{"name":"macos-x86_64","runner":"macos-15-intel","zig_tarball":"zig-x86_64-macos"},{"name":"macos-aarch64","runner":"macos-15","zig_tarball":"zig-aarch64-macos"}]' || '[{"name":"linux-x86_64","runner":"ubuntu-24.04","zig_tarball":"zig-x86_64-linux"}]') }}
        optimize: [ReleaseSafe]
        shard:
          - index: 0
            shard_count: 4
            label: "1/4"
          - index: 1
            shard_count: 4
            label: "2/4"
          - index: 2
            shard_count: 4
            label: "3/4"
          - index: 3
            shard_count: 4
            label: "4/4"
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          use-cache: false

      - name: Download tested binary
        uses: actions/download-artifact@v4
        with:
          name: fx-ci-${{ matrix.platform.name }}-${{ matrix.optimize }}-${{ github.sha }}
          path: ${{ runner.temp }}/fx-ci

      - name: Restore tested binary
        shell: bash
        run: |
          mkdir -p zig-out/bin
          tar -xf "$RUNNER_TEMP/fx-ci/fx-ci.tar" -C zig-out/bin
          test -x zig-out/bin/fx

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E system dependencies
        shell: bash
        timeout-minutes: 17
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            missing=()
            command -v tmux >/dev/null 2>&1 || missing+=(tmux)
            command -v zsh >/dev/null 2>&1 || missing+=(zsh)
            if [ "${#missing[@]}" -gt 0 ]; then
              retry() {
                local attempt
                for attempt in 1 2; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$attempt" -lt 2 ]; then
                    printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                    sleep 5
                  fi
                done
                return 1
              }
              # The Azure mirror can stall after APT has already fetched release
              # metadata from the direct Ubuntu fallback. Prefer that fallback
              # for the whole update when the runner's mirror list provides it.
              if [ -f /etc/apt/apt-mirrors.txt ] &&
                grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
              then
                sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
              fi
              retry sudo timeout --kill-after=15s 4m apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              retry sudo timeout --kill-after=15s 3m apt-get \
                -o Dpkg::Use-Pty=0 \
                install -y "${missing[@]}"
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run deterministic E2E shard
        shell: bash
        working-directory: tests/e2e
        run: |
          selected=()
          selection_file="$RUNNER_TEMP/fx-e2e-shard-${SHARD_INDEX}.txt"
          bun ci-shards.ts \
            --shard-count "$SHARD_COUNT" \
            --shard-index "$SHARD_INDEX" > "$selection_file"
          while IFS= read -r test_file; do
            selected+=("$test_file")
          done < "$selection_file"

          test "${#selected[@]}" -gt 0
          printf 'Running E2E shard %s/%s (%s files):\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"

          shard_status=0
          test_number=0
          for test_file in "${selected[@]}"; do
            tmux_tmp_dir="$RUNNER_TEMP/fx-e2e-tmux-${SHARD_INDEX}-${test_number}"
            mkdir -p "$tmux_tmp_dir"
            started=$SECONDS
            file_status=0
            if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 --retry 1 "./$test_file"; then
              shard_status=1
              file_status=1
            fi
            printf '%s\t%s\t%s\n' "$test_file" "$((SECONDS - started))" "$file_status" >> "$RUNNER_TEMP/e2e-timings.tsv"
            TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
            test_number=$((test_number + 1))
          done
          exit "$shard_status"

      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-timings-${{ matrix.platform.name }}-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/e2e-timings.tsv
          retention-days: 7

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() && !(vars.PRIVATE_CI_ENABLED == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'ripgrim' && github.event.pull_request.head.repo.full_name == 'ripgrim/fx') }}
    needs:
      - build
      - native
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.all_platforms == true && '["linux-x86_64","linux-aarch64","macos-x86_64","macos-aarch64"]' || '["linux-x86_64"]') }}
    steps:
      - name: Verify native and E2E matrices
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            ([
              "Build (ReleaseSafe, " + $target + ")",
              "Native checks (ReleaseSafe, " + $target + ")",
              (range(1; 5) as $shard
                | "E2E (ReleaseSafe, " + $target + ", shard " + ($shard | tostring) + "/4)")
            ] | sort) as $expected
            |
            [
              .jobs[]
              | select(
                  (.name == ("Build (ReleaseSafe, " + $target + ")")) or
                  (.name == ("Native checks (ReleaseSafe, " + $target + ")")) or
                  (.name | startswith("E2E (ReleaseSafe, " + $target + ", shard "))
              )
            ] as $selected
            | (($selected | map(.name) | sort) == $expected and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"
